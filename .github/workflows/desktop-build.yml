name: Desktop Build
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release with the installers"
        type: boolean
        default: false
      release_tag:
        description: "Release tag to create/update (e.g. v0.1.0)"
        type: string
        default: "v0.1.0"
  push:
    branches:
      - develop
    paths:
      - "artifacts/craft-vita/**"
      - "lib/**"
      - "package.json"
      - ".npmrc"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop-build.yml"
    tags:
      - "v*"
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  desktop-build:
    name: Build desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      CI: true
      NODE_ENV: production
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
      VITE_FRONTEND_URL: ${{ secrets.VITE_FRONTEND_URL }}
      VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
      VITE_CLERK_SIGN_IN_URL: ${{ secrets.VITE_CLERK_SIGN_IN_URL }}
      VITE_CLERK_SIGN_UP_URL: ${{ secrets.VITE_CLERK_SIGN_UP_URL }}
      VITE_CLERK_AFTER_SIGN_IN_URL: ${{ secrets.VITE_CLERK_AFTER_SIGN_IN_URL }}
      VITE_CLERK_AFTER_SIGN_UP_URL: ${{ secrets.VITE_CLERK_AFTER_SIGN_UP_URL }}
      VITE_INACTIVITY_TIMEOUT_MS: ${{ secrets.VITE_INACTIVITY_TIMEOUT_MS }}
      VITE_INACTIVITY_WARNING_MS: ${{ secrets.VITE_INACTIVITY_WARNING_MS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev
      - name: Install dependencies
        # NODE_ENV=development for THIS step only: the job-level NODE_ENV=production
        # must not cause devDependencies (vite/rollup/esbuild) or their per-platform
        # optional native binaries to be skipped during install. The build steps
        # below still produce a production bundle (Vite sets its own build mode).
        env:
          NODE_ENV: development
        run: |
          pnpm install --no-frozen-lockfile --config.optional=true
      - name: Typecheck desktop package
        run: pnpm --filter @workspace/craft-vita typecheck
      - name: Stamp app version from release tag
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/sync-version-from-tag.mjs
      - name: Build desktop frontend
        run: pnpm --filter @workspace/craft-vita build
      - name: Build Tauri desktop app
        working-directory: artifacts/craft-vita
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build
      - name: Upload desktop bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hireshade-${{ runner.os }}
          if-no-files-found: ignore
          path: |
            artifacts/craft-vita/src-tauri/target/release/bundle/**/*
      - name: Collect installers
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: |
          mkdir -p dist-installers
          find artifacts/craft-vita/src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
               -o -name '*.msi' -o -name '*.msi.zip' -o -name '*.msi.zip.sig' \
               -o -name '*.AppImage' -o -name '*.AppImage.tar.gz' -o -name '*.AppImage.tar.gz.sig' \
               -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} dist-installers/ \; || true
          ls -la dist-installers/ || true
      - name: Publish / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          name: HireShade ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: dist-installers/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
