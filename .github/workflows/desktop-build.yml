name: Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - "artifacts/craft-vita/**"
      - "lib/**"
      - "package.json"
      - ".npmrc"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/ci-patch-tauri-build.sh"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  desktop-build:
    name: Build desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    env:
      CI: true
      NODE_ENV: production
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_DEEPGRAM_API_KEY: ${{ secrets.VITE_DEEPGRAM_API_KEY }}
      VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
      VITE_FRONTEND_URL: ${{ secrets.VITE_FRONTEND_URL }}
      VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
      VITE_CLERK_SIGN_IN_URL: ${{ secrets.VITE_CLERK_SIGN_IN_URL }}
      VITE_CLERK_SIGN_UP_URL: ${{ secrets.VITE_CLERK_SIGN_UP_URL }}
      VITE_CLERK_AFTER_SIGN_IN_URL: ${{ secrets.VITE_CLERK_AFTER_SIGN_IN_URL }}
      VITE_CLERK_AFTER_SIGN_UP_URL: ${{ secrets.VITE_CLERK_AFTER_SIGN_UP_URL }}
      VITE_INACTIVITY_TIMEOUT_MS: ${{ secrets.VITE_INACTIVITY_TIMEOUT_MS }}
      VITE_INACTIVITY_WARNING_MS: ${{ secrets.VITE_INACTIVITY_WARNING_MS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev

      - name: Install dependencies
        run: |
          pnpm store prune || true
          pnpm install --no-frozen-lockfile --config.optional=true

      - name: Verify Rollup native package
        run: |
          node - <<'NODE'
          const os = process.platform;
          const arch = process.arch;
          const pkg = os === 'win32'
            ? '@rollup/rollup-win32-x64-msvc'
            : os === 'darwin'
              ? (arch === 'arm64' ? '@rollup/rollup-darwin-arm64' : '@rollup/rollup-darwin-x64')
              : '@rollup/rollup-linux-x64-gnu';
          require.resolve(pkg);
          console.log(`Verified ${pkg}`);
          NODE

      - name: Apply CI Tauri compatibility patch
        run: bash scripts/ci-patch-tauri-build.sh

      - name: Typecheck desktop package
        run: pnpm --filter @workspace/craft-vita typecheck

      - name: Build desktop frontend
        run: pnpm --filter @workspace/craft-vita build

      - name: Build Tauri desktop app
        working-directory: artifacts/craft-vita
        run: pnpm tauri build

      - name: Upload desktop bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hireshade-${{ runner.os }}
          if-no-files-found: ignore
          path: |
            artifacts/craft-vita/src-tauri/target/release/bundle/**/*
