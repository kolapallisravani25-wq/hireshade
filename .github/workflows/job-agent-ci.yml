name: Job Agent CI

on:
  pull_request:
    paths:
      - "artifacts/job-agent-platform/**"
      - ".github/workflows/job-agent-ci.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/job-agent-platform/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm --filter @workspace/job-agent-platform lint
      - name: Typecheck
        run: pnpm --filter @workspace/job-agent-platform typecheck
      - name: Unit tests
        run: pnpm --filter @workspace/job-agent-platform test
      - name: Production build
        run: pnpm --filter @workspace/job-agent-platform build
